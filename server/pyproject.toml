[project]
name = "opa"
version = "0.1.0"
description = "Open Personal Agent — self-hostable personal agent (v0.1)"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "argon2-cffi>=23.1",
  "python-ulid>=2.7",
  "jsonschema>=4.23",
  "httpx>=0.27",
  "anthropic>=0.40",
  "pyyaml>=6.0",
  "typer>=0.12",
  "cryptography>=43",
  "authlib>=1.3",
  # M4: trusted renderers and extraction (ART-01)
  "markdown-it-py>=3.0",
  "nh3>=0.2.14",
  "pypdf>=5.0",
  "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "pgserver>=0.1.4",
  "ruff>=0.6",
  "playwright>=1.48",
]

[project.scripts]
opa = "opa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opa"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 60

[tool.ruff]
line-length = 100
